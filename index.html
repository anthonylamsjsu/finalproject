<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BREATHING ROOM</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="breathing-room" id="breathingRoom">

    <section class="intro-screen" id="introScreen">
      <h1>BREATHING ROOM</h1>

      <p>
        A QUIET SPACE TO RETURN TO YOURSELF
      </p>

      <button id="startButton" class="start-button">
        START SESSION
      </button>
    </section>

    <section class="session-screen" id="sessionScreen">

      <header class="site-title">
        BREATHING ROOM
      </header>

      <div class="breath-label" id="breathLabel">
        BREATHE IN
      </div>

      <div class="orb-field" id="orbField">

        <div class="center-light"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

      </div>

      <section class="timer-area">

        <div class="timer" id="timer">
          03:00
        </div>

        <div class="timer-label">
          TIME REMAINING
        </div>

      </section>

      <button class="end-button" id="endButton">
        END SESSION
      </button>

      <div class="session-length">
        3 MIN SESSION
      </div>

      <div class="guide" id="guide">
        INHALE 4 · HOLD 2 · EXHALE 6 · REST 2
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
