<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GHOST IN THE MACHINE</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="void">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>
  </div>

  <div id="memoryLayer"></div>
  <div id="particleLayer"></div>

  <main class="container">

    <h1>GHOST IN THE MACHINE</h1>

    <p class="subtitle">
      A CONFESSIONAL TO YOUR PAST LIVES AND FUTURE SELVES
    </p>

    <form id="confessionForm" class="confession-box">

      <input
        id="confessionInput"
        type="text"
        autocomplete="off"
        placeholder="TYPE YOUR CONFESSION..."
      />

      <button type="submit">→</button>

    </form>

    <p class="note">
      YOUR WORDS WILL DRIFT INTO THE VOID ANONYMOUSLY, ENDLESSLY.
    </p>

  </main>

  <div id="messageLayer"></div>

  <script src="script.js"></script>

</body>

</html>
