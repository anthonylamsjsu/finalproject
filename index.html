<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BREATHING ROOM</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="breathing-room">

    <header class="site-title">
      BREATHING ROOM
    </header>

    <div class="sound-toggle">
      <span>SOUND</span>
      <span class="sound-dot"></span>
      <span>ON</span>
      <span class="sound-ring"></span>
    </div>

    <section class="meditation-stage">

      <div class="breath-label" id="breathLabel">
        BREATHE IN
      </div>

      <div class="orb-field">

        <div class="center-light"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>

      </div>

    </section>

    <section class="timer-area">

      <div class="timer" id="timer">
        03:00
      </div>

      <div class="timer-label">
        TIME REMAINING
      </div>

    </section>

    <button class="end-button" id="endButton">
      END SESSION
    </button>

    <div class="session-length">
      3 MIN SESSION
    </div>

    <div class="guide">
      GUIDE
    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
